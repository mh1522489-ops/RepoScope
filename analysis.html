<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Analysis | RepoScope</title>
    <link rel="stylesheet" href="style/analysis.css">
    <script src="script/analysis.js" defer></script>
</head>
<body>
    <header>
        <h1>Repository Analysis</h1>
    </header>

    <main>
        <p id="analysis-status" role="status" aria-live="polite">
            Preparing analysis...
        </p>

        <section id="analysis-report" hidden></section>
        <div id="loading-screen">
            <img src="../loading-screen.png" alt="loading screen img ">
        </div>
        <h1>Owner Followers</h1>
        <section id="followrs"></section>
        <h1>Owner Gists</h1>
        <section id="gists"></section>
        <h1>forks</h1>
        <section id="forks"></section>
        <h1>issues</h1>
        <section id="issue"></section>
        <h1>events</h1>
        <section id="events">
        </section>
        <h1>assignees</h1>
        <section id="assignees"> </section>
    </main>
    
</body>
</html>
