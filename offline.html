<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>You're Offline — RepoScope</title>  <style>
    :root {
      --primary: #6750d8;
      --primary-light: #eeeaff;
      --text: #211f2b;
      --muted: #777384;
      --bg: #faf9fd;
      --card: #ffffff;
      --border: #e8e5f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);
      background:
        radial-gradient(
          circle at top left,
          #eeeaff 0,
          transparent 35%
        ),
        var(--bg);
    }

    .offline-page {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 35px;

      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;

      color: white;
      background: var(--primary);
      border-radius: 12px;

      box-shadow: 0 8px 25px rgba(103, 80, 216, 0.25);
    }

    .card {
      padding: 50px 30px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;

      box-shadow:
        0 20px 60px rgba(34, 27, 61, 0.08);
    }

    .illustration {
      width: min(100%, 360px);
      margin: 0 auto 30px;
    }

    .illustration svg {
      width: 100%;
      height: auto;
      display: block;
    }

    h1 {
      margin: 0 0 14px;

      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.05;
      letter-spacing: -2px;
    }

    .description {
      max-width: 560px;
      margin: 0 auto;

      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    button {
      border: 0;
      cursor: pointer;

      padding: 13px 22px;
      border-radius: 12px;

      font: inherit;
      font-weight: 700;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .retry {
      color: white;
      background: var(--primary);

      box-shadow:
        0 8px 20px rgba(103, 80, 216, 0.25);
    }

    .retry:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 28px rgba(103, 80, 216, 0.3);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-top: 28px;
      padding: 8px 13px;

      color: #716c7d;
      background: #f5f3f9;
      border-radius: 999px;

      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e5a000;
    }

    .footer {
      margin-top: 25px;

      color: #9994a5;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 35px 20px;
        border-radius: 22px;
      }

      .logo {
        margin-bottom: 25px;
      }

      .description {
        font-size: 15px;
      }

      .illustration {
        width: 280px;
      }
    }
    .span {
      position: absolute;

      width: 20px;
      height: 20px;

      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);

      transform: scale(0);
      animation: ripple 0.6s linear;

      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: scale(12);
        opacity: 0;
        
      }
    }
.retry {
  position: relative;
  overflow: hidden;
  
}
  </style></head><body>  <main class="offline-page"><div class="logo">
  <div class="logo-icon">
    &lt;/&gt;
  </div>

  <span>RepoScope</span>
</div>

<section class="card">

  <!-- Offline Illustration -->
  <div class="illustration">

    <svg
      viewBox="0 0 500 350"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="Offline illustration"
      role="img"
    >

      <!-- Background -->
      <rect
        x="30"
        y="30"
        width="440"
        height="290"
        rx="35"
        fill="#f6f4ff"
      />

      <!-- Repository -->
      <rect
        x="125"
        y="95"
        width="250"
        height="165"
        rx="18"
        fill="white"
        stroke="#ded9f0"
        stroke-width="4"
      />

      <!-- Folder -->
      <path
        d="M160 115
           H235
           L252 135
           H340
           Q355 135 355 150
           V215
           Q355 230 340 230
           H160
           Q145 230 145 215
           V130
           Q145 115 160 115Z"
        fill="#eeeaff"
        stroke="#6750d8"
        stroke-width="5"
      />

      <!-- Code lines -->
      <rect
        x="180"
        y="155"
        width="90"
        height="8"
        rx="4"
        fill="#6750d8"
      />

      <rect
        x="180"
        y="177"
        width="130"
        height="8"
        rx="4"
        fill="#d2ccef"
      />

      <rect
        x="180"
        y="199"
        width="105"
        height="8"
        rx="4"
        fill="#d2ccef"
      />

      <!-- Connection line -->
      <path
        d="M375 170
           C410 170 420 150 445 150"
        fill="none"
        stroke="#b9b2d7"
        stroke-width="5"
        stroke-linecap="round"
        stroke-dasharray="10 10"
      />

      <!-- Offline Circle -->
      <circle
        cx="430"
        cy="150"
        r="42"
        fill="white"
        stroke="#6750d8"
        stroke-width="5"
      />

      <!-- Wifi -->
      <path
        d="M408 145
           Q430 125 452 145"
        fill="none"
        stroke="#6750d8"
        stroke-width="5"
        stroke-linecap="round"
      />

      <path
        d="M416 156
           Q430 143 444 156"
        fill="none"
        stroke="#6750d8"
        stroke-width="5"
        stroke-linecap="round"
      />

      <circle
        cx="430"
        cy="166"
        r="4"
        fill="#6750d8"
      />

      <!-- Slash -->
      <line
        x1="402"
        y1="178"
        x2="458"
        y2="122"
        stroke="#e45b5b"
        stroke-width="8"
        stroke-linecap="round"
      />

      <!-- Small decorative dots -->
      <circle cx="85" cy="105" r="7" fill="#d8d2f5"/>
      <circle cx="405" cy="265" r="9" fill="#ded9f0"/>
      <circle cx="100" cy="250" r="5" fill="#c9c2eb"/>

    </svg>

  </div>

  <h1>You're offline</h1>

  <p class="description">
    RepoScope needs an internet connection to analyze
    GitHub repositories. Check your connection and try again.
  </p>

  <div class="actions">
    <button
      class="retry"
      id="retry-button"
    >
      Try Again
    </button>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    No internet connection
  </div>

</section>

<p class="footer">
  RepoScope · GitHub Repository Analyzer
</p>

  </main>  <script>
       
    window.addEventListener("online", () => {
 const offline = sessionStorage.getItem("offlinepage");
 if(offline){
     sessionStorage.removeItem("offlinepage");
     window.location.href = offline;
 }
     
    });
    
   const button = document.getElementById("retry-button")
    button.onclick = function(e){
        const span = document.createElement("span");
        span.classList.add("span");
        button.appendChild(span)
        const rect = button.getBoundingClientRect();
        span.style.left = `${event.clientX - rect.left}px`;
        span.style.top = `${event.clietY - rect.right}px`
    span.addEventListener("animationend",function(){
          span.remove()
      })
        
    }
    
  </script>
  </body>
</html>
